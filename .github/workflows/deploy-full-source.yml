name: Deploy full source
on:
  push:
    paths:
      - '.github/workflows/deploy-full-source.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write verified index
        shell: python
        run: |
          import base64,gzip
          from pathlib import Path
          payload=''
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(payload)))
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Persist settings and collapse solved gaps"
          git push

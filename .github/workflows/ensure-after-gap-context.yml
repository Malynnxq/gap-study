name: Ensure after-gap context
on:
  push:
    paths:
      - '.github/workflows/ensure-after-gap-context.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend spoken context after gaps
        shell: python
        run: |
          from pathlib import Path
          p=Path('voice.html')
          s=p.read_text()
          old="function sentenceEnd(text,index){const right=text.slice(index),m=right.match(/[.!?](?:\\s|$)/);return m?index+m.index+1:text.length}"
          new="function contextEnd(text,index){const tail=text.slice(index),words=[...tail.matchAll(/[\\p{L}\\p{N}][\\p{L}\\p{N}'-]*/gu)];if(!words.length)return Math.min(text.length,index+1);const target=words[Math.min(9,words.length-1)];let end=index+target.index+target[0].length;const extra=text.slice(end,end+140),punct=extra.match(/[.!?](?:\\s|$)/);if(punct)end+=punct.index+1;else if(words.length>10){const cap=words[Math.min(15,words.length-1)];end=index+cap.index+cap[0].length}return Math.min(text.length,end)}"
          if old not in s: raise SystemExit('sentenceEnd function not found')
          s=s.replace(old,new)
          old_build="const start=sentenceStart(text,m.index),end=sentenceEnd(text,m.index+m[0].length);"
          new_build="const start=sentenceStart(text,m.index),end=contextEnd(text,m.index+m[0].length);"
          if old_build not in s: raise SystemExit('build context expression not found')
          s=s.replace(old_build,new_build)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add voice.html
          git diff --cached --quiet || git commit -m "Ensure enough context after each voice gap"
          git push

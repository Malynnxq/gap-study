name: Apply Gap Study update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-gap-study-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write updated index.html
        shell: bash
        run: |
          cat > /tmp/index.html.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/index.html.gz.b64 | gzip --decompress > index.html
      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Markdown rendering and latest study features' || exit 0
          git push

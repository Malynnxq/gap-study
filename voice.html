<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gap Study Voice</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#1b1e25;--text:#f5f7fb;--muted:#aeb5c2;--accent:#92a8ff;--line:#343a46;--good:#7ddd9e;--bad:#ff9e98}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif}.app{max-width:680px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}h1{margin:0 0 4px;font-size:1.7rem}p{color:var(--muted)}label{display:block;margin:13px 0 5px;color:var(--muted)}select,textarea,input,button{width:100%;font:16px system-ui;border-radius:12px;border:1px solid var(--line);background:#15181e;color:var(--text);padding:12px}textarea{min-height:180px;resize:vertical}button{min-height:50px;background:var(--accent);color:#10131a;font-weight:750;border:0;margin-top:12px}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.status{font-size:1.35rem;font-weight:750;text-align:center;margin:22px 0 6px}.detail{text-align:center;color:var(--muted);min-height:3em}.orb{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:22px auto;background:#272c37;border:2px solid var(--line);font-size:2.2rem}.speaking .orb{border-color:var(--accent);box-shadow:0 0 0 10px #92a8ff22}.listening .orb{border-color:var(--good);box-shadow:0 0 0 12px #7ddd9e22}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls button:last-child{grid-column:1/-1}.hidden{display:none}.tiny{font-size:.86rem;color:var(--muted)}
</style>
</head>
<body><main class="app">
<section id="setup" class="card"><h1>Eyes-free Gap Study</h1><p>Choose a saved text or paste one, then listen and answer aloud.</p>
<label>Saved text</label><select id="history"><option value="">Choose saved text…</option></select>
<label>Text</label><textarea id="text" placeholder="Paste study text here…"></textarea>
<label>Language</label><select id="language"><option value="en-US">English</option><option value="de-DE">Deutsch</option><option value="uk-UA">Українська</option><option value="ru-RU">Русский</option></select>
<label>Voice</label><select id="voice"><option value="">Best available voice</option></select>
<label>Gap density</label><input id="density" type="range" min="5" max="35" value="15"><div class="tiny"><span id="densityValue">15%</span> of suitable words</div>
<button id="start">Start eyes-free session</button></section>
<section id="session" class="card hidden"><div id="state"><div class="orb">◉</div><div id="status" class="status">Ready</div><div id="detail" class="detail"></div></div><div class="controls"><button id="repeat" class="secondary">Repeat</button><button id="skip" class="secondary">Reveal / skip</button><button id="stop">Stop</button></div></section>
</main>
<script>
const $=s=>document.querySelector(s),HISTORY_KEY='gapStudyHistoryV1',VOICE_KEY='gapStudyVoiceNaturalV1';
const STOP=new Set(`a an the and or but if then than so because as at by for from in into of on onto over under through to up down with without about is am are was were be been being do does did have has had can could may might must shall should will would not no nor this that these those it its they them their he him his she her we us our you your i me my who which what when where why how all any both each more most other some such only same too very just also`.split(/\s+/));
let voices=[],running=false,items=[],cursor=0,current=null,lastContext='',recognition=null;
function history(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{return[]}}
function loadHistory(){const h=history();$('#history').innerHTML='<option value="">Choose saved text…</option>'+h.map(x=>`<option value="${x.id}">${escape(x.title)}</option>`).join('')}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#history').onchange=()=>{const x=history().find(y=>y.id===$('#history').value);if(x)$('#text').value=x.text};
$('#density').oninput=()=>$('#densityValue').textContent=$('#density').value+'%';
function loadVoices(){voices=speechSynthesis.getVoices();const lang=$('#language').value.slice(0,2).toLowerCase(),matching=voices.filter(v=>v.lang.toLowerCase().startsWith(lang)),saved=localStorage.getItem(VOICE_KEY)||'';$('#voice').innerHTML='<option value="">Best available voice</option>'+matching.map(v=>`<option value="${escape(v.name)}">${escape(v.name)}${v.localService?'':' · online'}</option>`).join('');if(matching.some(v=>v.name===saved))$('#voice').value=saved}
speechSynthesis.onvoiceschanged=loadVoices;$('#language').onchange=loadVoices;$('#voice').onchange=()=>localStorage.setItem(VOICE_KEY,$('#voice').value);setTimeout(loadVoices,200);loadHistory();
function chosenVoice(){const selected=$('#voice').value;if(selected)return voices.find(v=>v.name===selected)||null;const lang=$('#language').value.slice(0,2).toLowerCase(),c=voices.filter(v=>v.lang.toLowerCase().startsWith(lang));const better=/premium|enhanced|natural|neural|samantha|ava|serena|daniel|anna|petra|milena|kateryna|yuri/i;return c.find(v=>better.test(v.name))||c.find(v=>v.default)||c[0]||null}
function normalize(s){return s.toLowerCase().normalize('NFKD').replace(/\p{M}/gu,'').replace(/[^\p{L}\p{N}'-]+/gu,' ').trim()}
function build(text){const words=[...text.matchAll(/[\p{L}][\p{L}\p{N}'-]*/gu)],eligible=words.filter(m=>m[0].length>=4&&!STOP.has(m[0].toLowerCase())),count=Math.max(1,Math.round(eligible.length*(+$('#density').value/100))),chosen=new Set(eligible.sort(()=>Math.random()-.5).slice(0,count).map(m=>m.index));let out=[],pos=0;for(const m of words){if(!chosen.has(m.index))continue;const before=text.slice(pos,m.index).replace(/[`*_#>~-]+/g,' ').replace(/\s+/g,' ').trim();if(before)out.push({type:'text',text:before});out.push({type:'gap',answer:m[0]});pos=m.index+m[0].length}const rest=text.slice(pos).replace(/[`*_#>~-]+/g,' ').replace(/\s+/g,' ').trim();if(rest)out.push({type:'text',text:rest});return out}
function chunks(text){const clean=text.replace(/\s+/g,' ').trim();if(!clean)return[];const sentences=clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[clean],out=[];for(const sentence of sentences){const clauses=sentence.match(/[^,;:]+[,;:]?|[^,;:]+$/g)||[sentence];for(const clause of clauses){const w=clause.trim().split(/\s+/);if(w.length<=15){if(clause.trim())out.push(clause.trim())}else for(let i=0;i<w.length;i+=12)out.push(w.slice(i,i+12).join(' '))}}return out}
function pause(c){if(/[.!?]$/.test(c))return550;if(/[,;:]$/.test(c))return280;return150}
function setState(text,kind=''){const s=$('#state');s.className=kind;$('#status').textContent=text}
function speak(text,done){if(!running)return;speechSynthesis.cancel();const list=chunks(text);let i=0;const next=()=>{if(!running)return;if(i>=list.length){done?.();return}const c=list[i++],u=new SpeechSynthesisUtterance(c);u.lang=$('#language').value;u.rate=.84;u.pitch=1.01;const v=chosenVoice();if(v)u.voice=v;u.onstart=()=>setState(c,'speaking');u.onend=()=>setTimeout(next,pause(c));u.onerror=()=>setTimeout(next,180);speechSynthesis.speak(u)};next()}
function listen(){if(!running)return;const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){setState('Speech recognition unavailable');$('#detail').textContent='This browser can read aloud but cannot listen automatically.';return}recognition?.abort();const r=new R();recognition=r;r.lang=$('#language').value;r.interimResults=false;r.maxAlternatives=4;r.onstart=()=>setState('Listening…','listening');r.onresult=e=>{const heard=[...e.results[0]].map(x=>x.transcript),cmd=normalize(heard[0]||'');if(['stop','pause','stopp','anhalten','стоп','зупинись'].includes(cmd)){stop();return}if(['repeat','again','wiederholen','повтори','ще раз'].includes(cmd)){repeat();return}if(['skip','reveal','überspringen','пропусти','пропустить'].includes(cmd)){reveal();return}const answer=normalize(current.answer),ok=heard.some(x=>normalize(x)===answer||normalize(x).split(' ').includes(answer));if(ok){current=null;speak('Correct.',()=>setTimeout(nextItem,350))}else speak('Not quite. Try again.',()=>setTimeout(listen,500))};r.onerror=e=>{if(!running)return;if(e.error==='not-allowed'){setState('Microphone permission denied');return}speak("I didn't hear that.",()=>setTimeout(listen,500))};try{r.start()}catch{setTimeout(listen,300)}}
function nextItem(){if(!running)return;if(cursor>=items.length){speak('Exercise finished.',stop);return}const x=items[cursor++];if(x.type==='text'){lastContext=x.text;speak(x.text,nextItem)}else{current=x;speak('Missing word.',()=>setTimeout(listen,800))}}
function repeat(){if(!running)return;if(current)speak((lastContext?lastContext+'. ':'')+'Missing word.',()=>setTimeout(listen,800));else if(lastContext)speak(lastContext,nextItem)}
function reveal(){if(!current)return;const a=current.answer;current=null;speak('The answer is '+a+'.',()=>setTimeout(nextItem,500))}
function start(){const text=$('#text').value.trim();if(!text)return alert('Choose or paste a text first.');items=build(text);cursor=0;current=null;lastContext='';running=true;$('#setup').classList.add('hidden');$('#session').classList.remove('hidden');$('#detail').textContent='Say the missing word. You can also say repeat, skip, or stop.';speak('Eyes free session started.',nextItem)}
function stop(){running=false;speechSynthesis.cancel();try{recognition?.abort()}catch{}$('#session').classList.add('hidden');$('#setup').classList.remove('hidden');setState('Stopped')}
$('#start').onclick=start;$('#repeat').onclick=repeat;$('#skip').onclick=reveal;$('#stop').onclick=stop;
</script></body></html>

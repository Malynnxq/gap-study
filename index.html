<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Gap Study</title>
  <style>
    :root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;color:#17191d;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}@media(prefers-color-scheme:dark){body{background:#111318;color:#f2f4f8}}.loading{padding:24px;text-align:center}.loading p{opacity:.7}
  </style>
</head>
<body>
  <main class="loading"><strong>Loading Gap Study…</strong><p id="loadingStatus">Preparing the exercise editor.</p></main>
  <script>
    (async () => {
      const revision = '441c608dc8f834a420da113c8bcc375259f784c5';
      const featureRevision = '8fc348525ed5287b6ea9499e50a48cc077f8eb66';
      const buildLabel = 'direct-cloud-loader';
      const titleColor = '#6a1b9a';
      const sources = [
        `https://cdn.jsdelivr.net/gh/Malynnxq/gap-study@${revision}/index.html`,
        `https://raw.githubusercontent.com/Malynnxq/gap-study/${revision}/index.html`
      ];
      let html = '';
      let lastError;
      for (const source of sources) {
        try {
          const response = await fetch(source, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          html = await response.text();
          break;
        } catch (error) {
          lastError = error;
        }
      }
      if (!html) {
        document.getElementById('loadingStatus').textContent = `Could not load the app. Please reload the page. (${lastError?.message || 'unknown error'})`;
        return;
      }
      const assetBase = `https://cdn.jsdelivr.net/gh/Malynnxq/gap-study@${featureRevision}`;
      const branchBase = 'https://raw.githubusercontent.com/Malynnxq/gap-study/feature/cross-device-sync';
      const buildMarker = `<style>.top h1{color:${titleColor}!important}.gap-study-build{display:inline-block;margin-left:.55rem;padding:.16rem .42rem;border:1px solid currentColor;border-radius:999px;font-size:.68rem;vertical-align:middle;opacity:.8}</style><script>addEventListener('DOMContentLoaded',()=>{const h=document.querySelector('.top h1');if(h&&!h.querySelector('.gap-study-build'))h.insertAdjacentHTML('beforeend','<span class="gap-study-build">build ${buildLabel}</span>')});<\/script>`;
      html = html.replace(/<\/head>/i, `${buildMarker}</head>`);
      const cloudLoader = `<script>(async()=>{try{const r=await fetch('${branchBase}/cloud-sync.js?v=${Date.now()}',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);(0,eval)(await r.text())}catch(e){console.error('Could not start cloud sync.',e)}})();<\/script>`;
      html = html.replace(/<\/body>/i, `<script src="${assetBase}/eta.js"><\/script><script src="${assetBase}/cloud-config.js"><\/script>${cloudLoader}</body>`);
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
</body>
</html>
